<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ATG">
  <title>ATG · Against the Grain</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-Cx_utTX8.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-_hMomCwq.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <header class="search">
    <div class="search-card">
      <div class="search-icons" aria-hidden="true">
        <span class="ico-me"></span>
        <span class="ico-dots"></span>
        <span class="ico-to"></span>
      </div>
      <div class="search-fields">
        <button id="from" class="field from" type="button"><span id="from-text">Your location</span></button>
        <label class="field to" for="to">
          <span class="sr-only">Destination</span>
          <input id="to" type="search" placeholder="Where to?" autocomplete="off" enterkeyhint="search">
        </label>
      </div>
      <button id="clear" class="clear" type="button" aria-label="Clear destination" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <section class="sheet" aria-label="Route">
    <div class="handle" aria-hidden="true"></div>

    <div class="modes" role="tablist" aria-label="Ride style">
      <button type="button" role="tab" data-mode="direct" aria-selected="true"><span class="mode-name">Direct</span><span class="mode-time" data-time="direct"></span></button>
      <button type="button" role="tab" data-mode="chill" aria-selected="false"><span class="mode-name">Chill</span><span class="mode-time" data-time="chill"></span></button>
      <button type="button" role="tab" data-mode="scenic" aria-selected="false"><span class="mode-name">Scenic</span><span class="mode-time" data-time="scenic"></span></button>
      <button type="button" role="tab" data-mode="wander" aria-selected="false" class="wander"><span class="mode-name">Wander</span><span class="mode-time">plan a day</span></button>
    </div>

    <div id="summary" class="summary"></div>

    <div class="actions">
      <button id="go" class="primary" type="button" disabled><span id="go-label">Let's go</span></button>
      <button id="shuffle" class="round" type="button" aria-label="Shuffle the plan" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button id="edit" class="round" type="button" aria-label="Change the plan settings" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <a id="gmaps" class="round" href="https://www.google.com/maps" target="_blank" rel="noopener" aria-label="Open in Google Maps" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </a>
    </div>
  </section>

</body>
</html>
